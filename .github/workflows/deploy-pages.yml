name: Deploy Discipline 360 site to GitHub Pages

# Publishes the static marketing site in discipline360-site/ to GitHub Pages.
# In the repo: Settings → Pages → Build and deployment → Source = "GitHub Actions".

on:
  push:
    branches:
      - main
      - claude/zonos-text-to-speech-oxnibg
      - claude/decipline360-marketing-site-a49fbd
    paths:
      - 'discipline360-site/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: discipline360-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
