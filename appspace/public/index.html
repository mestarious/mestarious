<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4f46e5" />
  <title>AppSpace — App Hub</title>
  <meta name="description" content="A home-screen app hub for phones without the Play Store. One tap to all your favorite apps." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
      </span>
      <h1>AppSpace</h1>
    </div>
    <button id="addBtn" class="icon-btn" type="button" aria-label="Add an app">+</button>
  </header>

  <div class="search-wrap">
    <input id="search" class="search" type="search" inputmode="search"
           placeholder="Search apps…" autocomplete="off" aria-label="Search apps" />
  </div>

  <nav id="chips" class="chips" aria-label="Categories"></nav>

  <main>
    <section id="pinnedSection" class="section" hidden>
      <h2 class="section-title">Pinned</h2>
      <div id="pinnedGrid" class="grid"></div>
    </section>

    <section class="section">
      <h2 id="allTitle" class="section-title">All apps</h2>
      <div id="grid" class="grid"></div>
      <p id="empty" class="empty" hidden>No apps match your search.</p>
    </section>
  </main>

  <p class="install-hint" id="installHint">
    Tip: open your browser menu and choose <strong>“Add to Home screen”</strong>
    to install AppSpace like a real app.
  </p>

  <!-- Add-app dialog -->
  <div id="dialog" class="dialog-backdrop" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
      <h2 id="dialogTitle">Add an app</h2>
      <label class="field">
        <span>Name</span>
        <input id="appName" type="text" placeholder="e.g. My Bank" />
      </label>
      <label class="field">
        <span>Web address (URL)</span>
        <input id="appUrl" type="url" inputmode="url" placeholder="https://example.com" />
      </label>
      <p id="dialogError" class="dialog-error" hidden></p>
      <div class="dialog-actions">
        <button id="cancelBtn" class="btn ghost" type="button">Cancel</button>
        <button id="saveBtn" class="btn primary" type="button">Add app</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
