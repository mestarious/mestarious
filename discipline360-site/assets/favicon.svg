<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Glowing filters to replicate neon lighting -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="core-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <!-- Gradient for the red background -->
    <linearGradient id="red-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1A1A" />
      <stop offset="100%" stop-color="#D60000" />
    </linearGradient>
    <!-- Glassmorphic lightning gradient -->
    <linearGradient id="bolt-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EBEBEB" />
    </linearGradient>
  </defs>

  <!-- Squircle Background -->
  <rect x="10" y="10" width="492" height="492" rx="110" fill="url(#red-gradient)" />

  <!-- Thin Neon Border (Neon Yellow/Orange Glow) -->
  <rect x="25" y="25" width="462" height="462" rx="95" fill="none" stroke="#FF9E00" stroke-width="4" filter="url(#neon-glow)" opacity="0.9" />
  <rect x="25" y="25" width="462" height="462" rx="95" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.95" />

  <!-- White Glowing Lightning Bolt -->
  <g filter="url(#core-glow)">
    <path d="M 295 80 
             L 170 275 
             L 255 275 
             L 225 432 
             L 342 237 
             L 257 237 
             Z" 
          fill="url(#bolt-gradient)" />
  </g>
</svg>
